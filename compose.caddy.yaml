services:
  caddy:
    build: ./configuration/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
      CF_API_TOKEN: ${CF_API_TOKEN:?}
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - ./configuration/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      grafana:
        condition: service_started
      nodered:
        condition: service_started
      chirpstack:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
