services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configuration/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./configuration/mqtt/passwd:/mosquitto/config/passwd:ro
      - mqtt_data:/mosquitto/data

volumes:
  mqtt_data:
