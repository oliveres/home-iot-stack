services:
  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-Europe/Prague}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?}
      NODE_RED_ADMIN_USER: ${NODE_RED_ADMIN_USER:-admin}
      NODE_RED_ADMIN_PASSWORD: ${NODE_RED_ADMIN_PASSWORD:?}
    volumes:
      - nodered_data:/data
      - ./configuration/nodered/settings.js:/data/settings.js:ro
    depends_on:
      mqtt:
        condition: service_started

volumes:
  nodered_data:
